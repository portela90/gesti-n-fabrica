# Copia de seguridad cada noche (el plan gratis de Supabase no hace copias) y, de paso, actividad diaria para que
# Supabase no pause el proyecto.
# - Copia el núcleo y las apps de ahora (esquemas nucleo, public, informes) con pg_dump, comprueba que trae las tablas,
#   la comprime y la CIFRA con la clave COPIA_CLAVE (solo la tiene Cristian). Se guarda 30 días en GitHub (Actions → la
#   ejecución → Artifacts). Sin la clave no se puede abrir, aunque el repositorio sea público.
# - Apunta la copia en nucleo.copias: sale en el panel «Salud de la app».
# Necesita dos secretos en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  = la dirección «Session pooler» de Supabase (botón Connect), con la contraseña de la base de datos.
#   COPIA_CLAVE      = una frase larga que elijas tú y guardes en un sitio seguro (sin ella no se recupera nada).
# Cómo recuperar una copia: docs/copias.md
name: Copia nocturna
on:
  schedule:
    - cron: "43 2 * * *"   # 02:43 UTC (madrugada en España)
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: copia
jobs:
  copia:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB: ${{ secrets.SUPABASE_DB_URL }}
      CLAVE: ${{ secrets.COPIA_CLAVE }}
    steps:
      - name: Comprobar que están los secretos
        run: |
          if [ -z "$DB" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_URL y/o COPIA_CLAVE (Settings → Secrets and variables → Actions)"; exit 1; fi
      - name: Revisar cómo está escrita la dirección (sin enseñar la contraseña)
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse as u
          bruto = os.environ['DB']; d = bruto.strip()
          avisos = []
          esquema, _, resto = d.partition('://')
          credenciales, _, servidor = resto.rpartition('@')   # la contraseña puede llevar @: el servidor va tras la última
          usuario, _, clave = credenciales.partition(':')
          host = servidor.split('/')[0]
          if esquema not in ('postgresql', 'postgres'): avisos.append('no empieza por postgresql://')
          if not usuario.startswith('postgres.'): avisos.append(f'el usuario es «{usuario}»: con el «Session pooler» tiene que ser postgres.<código del proyecto>')
          if '[' in d or ']' in d: avisos.append('quedan corchetes [ ]: hay que cambiar [YOUR-PASSWORD] entero, corchetes incluidos, por la contraseña')
          if 'YOUR-PASSWORD' in d: avisos.append('sigue poniendo YOUR-PASSWORD')
          if re.search(r'[@#/?:%\s]', clave) and u.unquote(clave) == clave: avisos.append('la contraseña tiene símbolos (@ # / ? : % o espacios): mejor una solo con letras y números')
          if d != bruto: avisos.append('hay espacios o saltos de línea al principio o al final (se quitan solos)')
          if 'pooler.supabase.com' not in host: avisos.append(f'el servidor es «{host}»: tiene que ser el del «Session pooler» (…pooler.supabase.com)')
          print(f'usuario: {usuario}')
          print(f'servidor: {host}')
          print(f'contraseña: {len(clave)} caracteres')
          for a in avisos: print(f'::warning::{a}')
          if not avisos: print('La dirección tiene buena forma. Si aun así falla, la contraseña no es la de la base de datos (o se cambió hace menos de un minuto).')
          PY
      - name: Instalar pg_dump 17 (el mismo que Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          # la clave del repositorio de PostgreSQL: varios intentos y dos direcciones (a veces una corta la conexión)
          ok=0
          for i in 1 2 3 4 5; do
            for u in https://www.postgresql.org/media/keys/ACCC4CF8.asc https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc; do
              if sudo curl -fsS --retry 3 --retry-all-errors --connect-timeout 20 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc "$u"; then ok=1; break 2; fi
            done
            sleep $((i * 10))
          done
          [ "$ok" = 1 ] || { echo "::error::No se pudo descargar la clave de PostgreSQL (fallo de internet en GitHub). Vuelve a lanzarla en un rato."; exit 1; }
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          for i in 1 2 3; do
            sudo apt-get update -qq -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/pgdg.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0 \
              && sudo apt-get install -y -qq postgresql-client-17 && break
            sleep $((i * 15))
          done
          test -x /usr/lib/postgresql/17/bin/pg_dump || { echo "::error::No se pudo instalar pg_dump 17. Vuelve a lanzarla en un rato."; exit 1; }
      - name: Hacer la copia, comprobarla y cifrarla
        run: |
          set -euo pipefail
          BIN=/usr/lib/postgresql/17/bin
          F="copia-$(date -u +%F).sql"
          $BIN/pg_dump "$(echo "$DB" | tr -d '[:space:]')" --no-owner --no-privileges -n nucleo -n public -n informes -f "$F"
          tablas=$(grep -c '^CREATE TABLE' "$F" || true)
          grep -q '^CREATE TABLE nucleo.empresas' "$F" || { echo "::error::La copia no trae las tablas del núcleo"; exit 1; }
          grep -q '^COPY nucleo.empresas' "$F" || { echo "::error::La copia no trae los datos del núcleo"; exit 1; }
          bytes=$(stat -c %s "$F")
          gzip -9 "$F"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$F.gz" -out "$F.gz.cifrado" -pass env:CLAVE
          rm "$F.gz"
          echo "Copia: $tablas tablas, $bytes bytes sin comprimir"
          $BIN/psql "$(echo "$DB" | tr -d '[:space:]')" -v ON_ERROR_STOP=1 -q -c "insert into nucleo.copias (bytes, tablas, nota) values ($bytes, $tablas, 'GitHub Actions')"
      - uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_id }}
          path: "*.cifrado"
          retention-days: 30
      - name: Que GitHub no apague esta tarea por inactividad
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/copia-nocturna.yml/enable" || true
